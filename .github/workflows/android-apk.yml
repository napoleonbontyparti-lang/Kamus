# Сборка APK на серверах GitHub. Запуск: вкладка Actions → «Build Android APK» → Run workflow.
# Готовый файл: открыть завершённый запуск → блок Artifacts → kamus-apk (zip с app-release.apk).
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04  # Android SDK уже предустановлен
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Diagnose inline modules
        working-directory: android
        run: |
          E="$GITHUB_WORKSPACE/node_modules/expo/android"
          node --no-warnings --eval "require('expo/bin/autolinking')" expo-modules-autolinking mirror-kotlin-inline-modules \
            --kotlin-files-mirror-directory "$E/src/main/java/inline/modules" \
            --inline-modules-list-directory "$E/build/generated/expo/inlineModules" \
            --watched-directories-serialized "[]" > /tmp/diag.txt 2>&1 || true
          echo "pwd=$(pwd) node=$(node -v)" >> /tmp/diag.txt
          echo "::warning title=Diag::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' /tmp/diag.txt)"

      - name: Build release APK
        working-directory: android
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/gradle.log || {
            # причину ошибки — в аннотации, чтобы её было видно без скачивания логов
            { grep -B2 -A25 "autolinking failed\|Error:" /tmp/gradle.log | head -60; awk '/What went wrong/{f=1} f{print} /Try:/{if(f)exit}' /tmp/gradle.log | head -20; } > /tmp/err.txt
            [ -s /tmp/err.txt ] || grep -iE "error|exception" /tmp/gradle.log | tail -25 > /tmp/err.txt
            echo "::error title=Gradle::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' /tmp/err.txt)"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: kamus-apk
          path: android/app/build/outputs/apk/release/app-release.apk
