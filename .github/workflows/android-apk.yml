# Сборка APK на серверах GitHub. Запуск: вкладка Actions → «Build Android APK» → Run workflow.
# Готовый файл: открыть завершённый запуск → блок Artifacts → kamus-apk (zip с app-release.apk).
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # чтобы публиковать APK в Releases

jobs:
  build:
    runs-on: ubuntu-24.04  # Android SDK уже предустановлен
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Check KataCil server (Supabase)
        continue-on-error: true
        run: |
          URL=$(node -p "require('./app.json').expo.extra?.supabase?.url || ''")
          KEY=$(node -p "require('./app.json').expo.extra?.supabase?.anonKey || ''")
          [ -z "$URL" ] && { echo "::warning title=Server::сервер не настроен"; exit 0; }
          OUT=$(curl -s -X POST "$URL/rest/v1/rpc/find_profile" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
                -H "Content-Type: application/json" -d '{"p_code":"TEST-TEST"}' -w " HTTP:%{http_code}")
          echo "::warning title=Server::$OUT"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        run: |
          # с переводом строки: последняя строка gradle.properties его не имеет
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a 2>&1 | tee /tmp/gradle.log || {
            # причину ошибки — в аннотации, чтобы её было видно без скачивания логов
            { grep -B2 -A25 "autolinking failed\|Error:" /tmp/gradle.log | head -60; awk '/What went wrong/{f=1} f{print} /Try:/{if(f)exit}' /tmp/gradle.log | head -20; } > /tmp/err.txt
            [ -s /tmp/err.txt ] || grep -iE "error|exception" /tmp/gradle.log | tail -25 > /tmp/err.txt
            echo "::error title=Gradle::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' /tmp/err.txt)"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: katacil-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Прямая ссылка для телефона (без zip и без входа в GitHub):
      # https://github.com/<владелец>/<репозиторий>/releases/latest/download/KataCil.apk
      - name: Publish release
        run: cp android/app/build/outputs/apk/release/app-release.apk KataCil.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: KataCil 1.0.${{ github.run_number }}
          body: "Скачайте KataCil.apk на телефон Android и откройте его, чтобы установить. Сборка для современных 64-битных телефонов (arm64)."
          files: KataCil.apk
          make_latest: true
